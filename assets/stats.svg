<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 156" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="stShadow" x="-5%" y="-6%" width="110%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <style>
    .st-user { font-size: 15px; font-weight: 700; fill: #0F172A; }
    .st-val { font-size: 13px; font-weight: 700; fill: #0F172A; }
    .st-label { font-size: 13px; font-weight: 500; fill: #475569; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="306" height="152" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#stShadow)"/>

  <!-- Left Side: Octocat Avatar in Dark Circle -->
  <g transform="translate(24, 40)">
    <circle cx="36" cy="36" r="34" fill="#0F172A"/>
    <!-- Octocat Inverted Path -->
    <path d="M36 18 C26.6 18 19 25.6 19 35 C19 42.5 23.9 48.9 30.7 51.1 C31.5 51.3 31.8 50.8 31.8 50.3 C31.8 49.9 31.8 48.5 31.8 46.9 C27 47.9 26 44.8 26 44.8 C25.2 42.8 24.1 42.3 24.1 42.3 C22.6 41.2 24.2 41.2 24.2 41.2 C25.9 41.4 26.8 43 26.8 43 C28.3 45.6 30.8 44.8 31.8 44.4 C31.9 43.3 32.4 42.5 32.9 42.1 C29.1 41.7 25.1 40.2 25.1 33.7 C25.1 31.8 25.8 30.3 26.9 29.1 C26.7 28.7 26.1 26.9 27.1 24.6 C27.1 24.6 28.5 24.2 31.8 26.4 C33.1 26 34.6 25.8 36 25.8 C37.4 25.8 38.9 26 40.2 26.4 C43.5 24.2 44.9 24.6 44.9 24.6 C45.9 26.9 45.3 28.7 45.1 29.1 C46.2 30.3 46.9 31.8 46.9 33.7 C46.9 40.3 42.9 41.7 39.1 42.1 C39.7 42.6 40.2 43.7 40.2 45.3 C40.2 47.6 40.2 49.4 40.2 50 C40.2 50.5 40.5 51.3 41.3 51.1 C48.1 48.8 53 42.5 53 35 C53 25.6 45.4 18 36 18 Z" fill="#FFFFFF"/>
  </g>

  <!-- Right Side: Stats List -->
  <g transform="translate(118, 26)">
    <!-- Username Header -->
    <text x="0" y="16" class="st-user">Ashutosh2275</text>

    <!-- Item 1: Contributions -->
    <g transform="translate(0, 32)">
      <!-- Green Lightning Bolt -->
      <path d="M 6 0 L 1 7 L 6 7 L 4 14 L 11 6 L 6 6 Z" fill="#10B981"/>
      <text x="18" y="11" class="st-val">169 <tspan class="st-label">Contributions</tspan></text>
    </g>

    <!-- Item 2: Repositories -->
    <g transform="translate(0, 58)">
      <!-- Purple Repo / Book Icon -->
      <rect x="1" y="0" width="12" height="13" rx="2.5" fill="#8B5CF6"/>
      <rect x="3.5" y="2" width="7" height="9" rx="1.5" fill="#FFFFFF"/>
      <line x1="5.5" y1="5" x2="8.5" y2="5" stroke="#8B5CF6" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="5.5" y1="7.5" x2="8.5" y2="7.5" stroke="#8B5CF6" stroke-width="1.2" stroke-linecap="round"/>
      <text x="18" y="11" class="st-val">18 <tspan class="st-label">Repositories</tspan></text>
    </g>

    <!-- Item 3: Stars -->
    <g transform="translate(0, 84)">
      <!-- Yellow Star -->
      <polygon points="7,0 9.2,4.4 14,5.1 10.5,8.5 11.3,13.3 7,11 2.7,13.3 3.5,8.5 0,5.1 4.8,4.4" fill="#F59E0B"/>
      <text x="18" y="11" class="st-val">56 <tspan class="st-label">Stars</tspan></text>
    </g>
  </g>
</svg>
