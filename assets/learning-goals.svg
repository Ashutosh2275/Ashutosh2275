<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 156" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="goalShadow" x="-5%" y="-6%" width="110%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <style>
    .goal-title { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
    .goal-text { font-size: 11.5px; font-weight: 500; fill: #334155; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="306" height="152" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#goalShadow)"/>

  <!-- Title Row -->
  <g transform="translate(18, 16)">
    <!-- Bullseye Target Icon -->
    <circle cx="6" cy="6" r="6" fill="none" stroke="#2563EB" stroke-width="1.8"/>
    <circle cx="6" cy="6" r="3.2" fill="none" stroke="#2563EB" stroke-width="1.4"/>
    <circle cx="6" cy="6" r="1.2" fill="#2563EB"/>
    <text x="20" y="10" class="goal-title">Learning Goals</text>
  </g>

  <!-- Goals List -->
  <g transform="translate(18, 42)">
    <!-- Goal 1 -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="6" r="3.5" fill="#2563EB"/>
      <text x="16" y="10" class="goal-text">Expand ML &amp; Deep Learning skills</text>
    </g>

    <!-- Goal 2 -->
    <g transform="translate(0, 20)">
      <circle cx="5" cy="6" r="3.5" fill="#F59E0B"/>
      <text x="16" y="10" class="goal-text">Master Computer Vision architectures</text>
    </g>

    <!-- Goal 3 -->
    <g transform="translate(0, 40)">
      <circle cx="5" cy="6" r="3.5" fill="#EAB308"/>
      <text x="16" y="10" class="goal-text">Build Smart IoT Systems with AI</text>
    </g>

    <!-- Goal 4 -->
    <g transform="translate(0, 60)">
      <circle cx="5" cy="6" r="3.5" fill="#EA580C"/>
      <text x="16" y="10" class="goal-text">Contribute to Open Source</text>
    </g>

    <!-- Goal 5 -->
    <g transform="translate(0, 80)">
      <circle cx="5" cy="6" r="3.5" fill="#16A34A"/>
      <text x="16" y="10" class="goal-text">Keep exploring and learning new tech</text>
    </g>
  </g>
</svg>
