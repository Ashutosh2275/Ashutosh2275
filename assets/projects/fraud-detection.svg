<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="auto">
  <defs>
    <linearGradient id="fdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="fdShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect x="2" y="2" width="316" height="156" rx="16" fill="url(#fdBg)" stroke="#DCFCE7" stroke-width="1.5" filter="url(#fdShadow)"/>

  <!-- Subtle Grid Accent -->
  <g stroke="#BBF7D0" stroke-width="0.8" opacity="0.35">
    <line x1="30" y1="20" x2="30" y2="140"/>
    <line x1="70" y1="20" x2="70" y2="140"/>
    <line x1="110" y1="20" x2="110" y2="140"/>
    <line x1="150" y1="20" x2="150" y2="140"/>
    <line x1="190" y1="20" x2="190" y2="140"/>
    <line x1="230" y1="20" x2="230" y2="140"/>
    <line x1="270" y1="20" x2="270" y2="140"/>
    <line x1="20" y1="40" x2="300" y2="40"/>
    <line x1="20" y1="80" x2="300" y2="80"/>
    <line x1="20" y1="120" x2="300" y2="120"/>
  </g>

  <!-- Central Illustration Group -->
  <g transform="translate(108, 16)">
    <!-- Credit Card / Transaction Matrix Behind Shield -->
    <rect x="-10" y="32" width="86" height="54" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
    <rect x="-10" y="44" width="86" height="10" fill="#E2E8F0"/>
    <rect x="-2" y="62" width="18" height="12" rx="2" fill="#FDE68A"/>
    <line x1="22" y1="68" x2="68" y2="68" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

    <!-- Pulse Anomaly Wave underneath -->
    <path d="M-20 102 L5 102 L14 88 L24 116 L34 94 L44 106 L52 102 L95 102" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="116" r="3" fill="#EF4444"/>

    <!-- Prominent Security Shield -->
    <g transform="translate(36, 12)">
      <!-- Outer Shield Shadow/Glow -->
      <path d="M30 4 C48 4 60 14 60 28 C60 52 35 68 30 72 C25 68 0 52 0 28 C0 14 12 4 30 4 Z" fill="url(#shieldGrad)" filter="url(#fdShadow)"/>
      <!-- Inner Shield Highlight -->
      <path d="M30 8 C44 8 54 16 54 28 C54 48 34 62 30 66 C26 62 6 48 6 28 C6 16 16 8 30 8 Z" fill="#10B981"/>
      <!-- Shield Half Tone -->
      <path d="M30 8 C44 8 54 16 54 28 C54 48 34 62 30 66 L30 8 Z" fill="#059669" opacity="0.3"/>
      <!-- White Verified Checkmark -->
      <path d="M20 30 L27 37 L40 24" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Small Lock / Node Accent -->
    <g transform="translate(85, 20)">
      <circle cx="6" cy="6" r="5" fill="#34D399" opacity="0.8"/>
    </g>
  </g>
</svg>
