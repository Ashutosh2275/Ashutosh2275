<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="auto">
  <defs>
    <linearGradient id="draiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <filter id="draiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D97706" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect x="2" y="2" width="316" height="156" rx="16" fill="url(#draiBg)" stroke="#FDE68A" stroke-width="1.5" filter="url(#draiShadow)"/>

  <!-- Subtle Sensor Grid Accent -->
  <g stroke="#FCD34D" stroke-width="0.8" opacity="0.35">
    <line x1="30" y1="20" x2="30" y2="140"/>
    <line x1="70" y1="20" x2="70" y2="140"/>
    <line x1="110" y1="20" x2="110" y2="140"/>
    <line x1="150" y1="20" x2="150" y2="140"/>
    <line x1="190" y1="20" x2="190" y2="140"/>
    <line x1="230" y1="20" x2="230" y2="140"/>
    <line x1="270" y1="20" x2="270" y2="140"/>
    <line x1="20" y1="40" x2="300" y2="40"/>
    <line x1="20" y1="80" x2="300" y2="80"/>
    <line x1="20" y1="120" x2="300" y2="120"/>
  </g>

  <!-- Computer Vision Viewfinder Frame -->
  <g transform="translate(90, 16)">
    <!-- Viewport Screen -->
    <rect x="0" y="6" width="140" height="108" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>

    <!-- Corner Reticles / Camera Crosshairs -->
    <!-- Top-Left -->
    <path d="M8 18 L8 12 L14 12" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <!-- Top-Right -->
    <path d="M126 12 L132 12 L132 18" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <!-- Bottom-Left -->
    <path d="M8 102 L8 108 L14 108" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <!-- Bottom-Right -->
    <path d="M126 108 L132 108 L132 102" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

    <!-- Bounding Box 1: Worker & Safety Helmet -->
    <g transform="translate(18, 22)">
      <!-- Outer Bounding Box (Green) -->
      <rect x="0" y="0" width="56" height="78" fill="none" stroke="#10B981" stroke-width="1.8" stroke-dasharray="4,2"/>
      <!-- Label Tag -->
      <rect x="0" y="-12" width="52" height="12" rx="2" fill="#10B981"/>
      <text x="3" y="-3" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700">HELMET: 99%</text>

      <!-- Worker Head with Hardhat -->
      <!-- Helmet (Yellow/Orange) -->
      <path d="M18 18 C18 10 38 10 38 18 Z" fill="#F59E0B"/>
      <rect x="15" y="17" width="26" height="3" rx="1.5" fill="#D97706"/>
      <!-- Face -->
      <ellipse cx="28" cy="24" rx="6" ry="6.5" fill="#FED7AA"/>
      <!-- Torso -->
      <path d="M16 33 C16 30 20 28 28 28 C36 28 40 30 40 33 L40 68 L16 68 Z" fill="#3B82F6"/>
    </g>

    <!-- Bounding Box 2: Fire / Hazard Warning (Red) -->
    <g transform="translate(84, 46)">
      <rect x="0" y="0" width="46" height="50" fill="none" stroke="#EF4444" stroke-width="1.8"/>
      <rect x="0" y="-12" width="42" height="12" rx="2" fill="#EF4444"/>
      <text x="3" y="-3" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700">FIRE ALERT</text>

      <!-- Flame Icon inside Bounding Box -->
      <path d="M23 10 C23 10 30 18 30 26 C30 32 26 36 21 36 C16 36 12 32 12 26 C12 20 18 14 18 14 C18 14 17 22 21 24 C23 20 23 10 23 10 Z" fill="#F97316"/>
      <path d="M21 24 C21 24 25 28 25 32 C25 34 23 36 21 36 C19 36 17 34 17 32 C17 30 20 26 21 24 Z" fill="#FEF08A"/>
    </g>

    <!-- Model Stats Footer on Viewport -->
    <rect x="18" y="104" width="104" height="2" fill="#38BDF8" opacity="0.6"/>
  </g>
</svg>
