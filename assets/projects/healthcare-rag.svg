<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="auto">
  <defs>
    <linearGradient id="hcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F7FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="hcGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="hcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect x="2" y="2" width="316" height="156" rx="16" fill="url(#hcBg)" stroke="#E0F2FE" stroke-width="1.5" filter="url(#hcShadow)"/>

  <!-- Subtle Grid Accent -->
  <g stroke="#BAE6FD" stroke-width="0.8" opacity="0.35">
    <line x1="30" y1="20" x2="30" y2="140"/>
    <line x1="70" y1="20" x2="70" y2="140"/>
    <line x1="110" y1="20" x2="110" y2="140"/>
    <line x1="150" y1="20" x2="150" y2="140"/>
    <line x1="190" y1="20" x2="190" y2="140"/>
    <line x1="230" y1="20" x2="230" y2="140"/>
    <line x1="270" y1="20" x2="270" y2="140"/>
    <line x1="20" y1="40" x2="300" y2="40"/>
    <line x1="20" y1="80" x2="300" y2="80"/>
    <line x1="20" y1="120" x2="300" y2="120"/>
  </g>

  <!-- Central Illustration Group -->
  <g transform="translate(100, 24)">
    <!-- Document Card -->
    <rect x="36" y="8" width="76" height="96" rx="8" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <!-- Folded Corner -->
    <path d="M96 8 L112 24 L96 24 Z" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1"/>
    <!-- Hospital Red/Blue Cross -->
    <rect x="68" y="24" width="12" height="4" rx="2" fill="#2563EB"/>
    <rect x="72" y="20" width="4" height="12" rx="2" fill="#2563EB"/>
    <!-- Document Text Lines -->
    <line x1="48" y1="44" x2="100" y2="44" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="54" x2="92" y2="54" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="64" x2="98" y2="64" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <!-- Vector / Search Highlights -->
    <rect x="48" y="74" width="38" height="6" rx="3" fill="#BAE6FD"/>
    <rect x="48" y="86" width="50" height="6" rx="3" fill="#E0F2FE"/>

    <!-- Stethoscope -->
    <g transform="translate(0, 4)">
      <!-- Earpieces -->
      <path d="M12 20 C12 36 24 48 38 48 C48 48 56 42 60 34" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
      <path d="M8 16 L12 20" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
      <path d="M24 16 L20 20" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
      <circle cx="8" cy="15" r="2.5" fill="#0369A1"/>
      <circle cx="24" cy="15" r="2.5" fill="#0369A1"/>
      <!-- Tubing to Chestpiece -->
      <path d="M38 48 C38 78 18 84 18 96 C18 106 28 112 36 108" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
      <!-- Chestpiece / Diaphragm -->
      <circle cx="44" cy="106" r="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
      <circle cx="44" cy="106" r="6" fill="#0284C7"/>
    </g>

    <!-- AI Sparkle Nodes -->
    <g fill="#2563EB">
      <path d="M22 6 L24 0 L26 6 L32 8 L26 10 L24 16 L22 10 L16 8 Z" opacity="0.9"/>
      <path d="M106 88 L107 83 L108 88 L113 89 L108 90 L107 95 L106 90 L101 89 Z" opacity="0.75"/>
    </g>
  </g>
</svg>
