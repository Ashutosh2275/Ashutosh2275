<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 156" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="langShadow" x="-5%" y="-6%" width="110%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <style>
    .lang-title { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
    .lang-name { font-size: 11.5px; font-weight: 500; fill: #334155; }
    .lang-pct { font-size: 11px; font-weight: 600; fill: #64748B; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="306" height="152" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#langShadow)"/>

  <!-- Title Row -->
  <g transform="translate(18, 16)">
    <!-- Brackets Code Icon -->
    <path d="M 2 4 L -2 8 L 2 12 M 10 4 L 14 8 L 10 12" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="10" class="lang-title">Most Used Languages</text>
  </g>

  <!-- Language List -->
  <g transform="translate(18, 42)">
    <!-- Row 1: Python (52.1%) -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="6" r="3.5" fill="#2563EB"/>
      <text x="16" y="10" class="lang-name">Python</text>
      <!-- Track -->
      <rect x="90" y="4" width="130" height="5" rx="2.5" fill="#F1F5F9"/>
      <!-- Fill (52.1% of 130 = ~68) -->
      <rect x="90" y="4" width="68" height="5" rx="2.5" fill="#2563EB"/>
      <text x="232" y="10" class="lang-pct">52.1%</text>
    </g>

    <!-- Row 2: TypeScript (18.3%) -->
    <g transform="translate(0, 20)">
      <circle cx="5" cy="6" r="3.5" fill="#0284C7"/>
      <text x="16" y="10" class="lang-name">TypeScript</text>
      <rect x="90" y="4" width="130" height="5" rx="2.5" fill="#F1F5F9"/>
      <!-- Fill (18.3% of 130 = ~24) -->
      <rect x="90" y="4" width="24" height="5" rx="2.5" fill="#0284C7"/>
      <text x="232" y="10" class="lang-pct">18.3%</text>
    </g>

    <!-- Row 3: JavaScript (14.6%) -->
    <g transform="translate(0, 40)">
      <circle cx="5" cy="6" r="3.5" fill="#EAB308"/>
      <text x="16" y="10" class="lang-name">JavaScript</text>
      <rect x="90" y="4" width="130" height="5" rx="2.5" fill="#F1F5F9"/>
      <!-- Fill (14.6% of 130 = ~19) -->
      <rect x="90" y="4" width="19" height="5" rx="2.5" fill="#EAB308"/>
      <text x="232" y="10" class="lang-pct">14.6%</text>
    </g>

    <!-- Row 4: HTML (8.2%) -->
    <g transform="translate(0, 60)">
      <circle cx="5" cy="6" r="3.5" fill="#EA580C"/>
      <text x="16" y="10" class="lang-name">HTML</text>
      <rect x="90" y="4" width="130" height="5" rx="2.5" fill="#F1F5F9"/>
      <!-- Fill (8.2% of 130 = ~11) -->
      <rect x="90" y="4" width="11" height="5" rx="2.5" fill="#EA580C"/>
      <text x="232" y="10" class="lang-pct">8.2%</text>
    </g>

    <!-- Row 5: Other (6.8%) -->
    <g transform="translate(0, 80)">
      <circle cx="5" cy="6" r="3" fill="none" stroke="#64748B" stroke-width="1.2"/>
      <text x="16" y="10" class="lang-name">Other</text>
      <rect x="90" y="4" width="130" height="5" rx="2.5" fill="#F1F5F9"/>
      <!-- Fill (6.8% of 130 = ~9) -->
      <rect x="90" y="4" width="9" height="5" rx="2.5" fill="#64748B"/>
      <text x="232" y="10" class="lang-pct">6.8%</text>
    </g>
  </g>
</svg>
