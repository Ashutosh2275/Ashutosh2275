<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="skShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <style>
    .cat-title { font-size: 13px; font-weight: 700; fill: #0F172A; }
  </style>

  <!-- Box 1: Languages (x=0, w=188) -->
  <g transform="translate(0, 4)" filter="url(#skShadow)">
    <rect x="0" y="0" width="188" height="118" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="28" class="cat-title">Languages</text>
    <g transform="translate(16, 48)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <path d="M12 0 C5.4 0 5.8 2.8 5.8 2.8 L5.8 5.7 L12.2 5.7 L12.2 6.6 L3.8 6.6 C1.1 6.6 0 8.1 0 11.8 C0 15.5 2.3 15.7 3.8 15.7 L6.2 15.7 L6.2 12.3 C6.2 10.3 7.8 8.7 9.8 8.7 L16.3 8.7 C17.8 8.7 19 7.4 19 5.8 L19 2.9 C19 0.9 17.1 0 12 0 Z M9.2 1.8 C9.8 1.8 10.3 2.3 10.3 2.9 C10.3 3.5 9.8 4 9.2 4 C8.6 4 8.1 3.5 8.1 2.9 C8.1 2.3 8.6 1.8 9.2 1.8 Z" fill="#387EB8"/>
        <path d="M12 24 C18.6 24 18.2 21.2 18.2 21.2 L18.2 18.3 L11.8 18.3 L11.8 17.4 L20.2 17.4 C22.9 17.4 24 15.9 24 12.2 C24 8.5 21.7 8.3 20.2 8.3 L17.8 8.3 L17.8 11.7 C17.8 13.7 16.2 15.3 14.2 15.3 L7.7 15.3 C6.2 15.3 5 16.6 5 18.2 L5 21.1 C5 23.1 6.9 24 12 24 Z M14.8 22.2 C14.2 22.2 13.7 21.7 13.7 21.1 C13.7 20.5 14.2 20 14.8 20 C15.4 20 15.9 20.5 15.9 21.1 C15.9 21.7 15.4 22.2 14.8 22.2 Z" fill="#FFE052"/>
      </g>
      <!-- Java -->
      <g transform="translate(34, 0)">
        <path d="M7 19 C10 20 14 20 17 19 M6 22 C10 23.5 14 23.5 18 22 M8 16 C11 17 13 17 16 16 M9 10 C8 7 11 5 13 3 C12 6 15 8 13 11 M13 8 C14 5 16 4 17 2 C16 5 18 6 16 9" stroke="#E76F00" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M6 14 C9 15 15 15 18 14" stroke="#5382A1" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </g>
      <!-- C/C++ -->
      <g transform="translate(68, 0)">
        <polygon points="12,1 22,6.5 22,17.5 12,23 2,17.5 2,6.5" fill="#659AD2"/>
        <circle cx="12" cy="12" r="5" fill="#FFFFFF"/>
        <path d="M 14 9 C 11 9, 10 10.5, 10 12 C 10 13.5, 11 15, 14 15" stroke="#004482" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </g>
      <!-- JS -->
      <g transform="translate(100, 0)">
        <rect x="0" y="0" width="24" height="24" rx="4" fill="#F7DF1E"/>
        <text x="5" y="18" font-size="12" font-weight="800" fill="#000000">JS</text>
      </g>
      <!-- TS -->
      <g transform="translate(132, 0)">
        <rect x="0" y="0" width="24" height="24" rx="4" fill="#3178C6"/>
        <text x="5" y="18" font-size="12" font-weight="800" fill="#FFFFFF">TS</text>
      </g>
    </g>
  </g>

  <!-- Box 2: AI / ML & GenAI (x=204, w=212) -->
  <g transform="translate(204, 4)" filter="url(#skShadow)">
    <rect x="0" y="0" width="212" height="118" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="28" class="cat-title">AI / ML &amp; GenAI</text>
    <g transform="translate(16, 48)">
      <!-- PyTorch -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="9" fill="none" stroke="#EE4C2C" stroke-width="2.5"/>
        <circle cx="18" cy="6" r="2.5" fill="#EE4C2C"/>
      </g>
      <!-- TensorFlow -->
      <g transform="translate(36, 0)">
        <polygon points="12,1 22,6.5 22,17.5 12,23 2,17.5 2,6.5" fill="#FF6F00"/>
        <polygon points="12,5 18,8.5 18,15.5 12,19 6,15.5 6,8.5" fill="#FFA800"/>
      </g>
      <!-- Scikit-learn -->
      <g transform="translate(72, 0)">
        <circle cx="8" cy="12" r="7" fill="#3499CD"/>
        <circle cx="18" cy="10" r="8" fill="#F89939"/>
        <text x="8" y="15" font-size="6.5" font-weight="800" fill="#FFFFFF">learn</text>
      </g>
      <!-- OpenAI -->
      <g transform="translate(112, 0)">
        <circle cx="12" cy="12" r="11" fill="#000000"/>
        <path d="M12 5 C15.8 5 19 8.2 19 12 C19 15.8 15.8 19 12 19 C8.2 19 5 15.8 5 12" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="3.5" fill="#FFFFFF"/>
      </g>
      <!-- Hugging Face -->
      <g transform="translate(148, 0)">
        <circle cx="12" cy="12" r="11" fill="#FFD21E"/>
        <circle cx="8" cy="10" r="2" fill="#000000"/>
        <circle cx="16" cy="10" r="2" fill="#000000"/>
        <path d="M 8 16 Q 12 20, 16 16" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Box 3: Frontend (x=432, w=180) -->
  <g transform="translate(432, 4)" filter="url(#skShadow)">
    <rect x="0" y="0" width="180" height="118" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="28" class="cat-title">Frontend</text>
    <g transform="translate(16, 48)">
      <!-- React -->
      <g transform="translate(0, 0)">
        <ellipse cx="12" cy="12" rx="11" ry="4.5" fill="none" stroke="#61DAFB" stroke-width="1.5"/>
        <ellipse cx="12" cy="12" rx="11" ry="4.5" fill="none" stroke="#61DAFB" stroke-width="1.5" transform="rotate(60 12 12)"/>
        <ellipse cx="12" cy="12" rx="11" ry="4.5" fill="none" stroke="#61DAFB" stroke-width="1.5" transform="rotate(120 12 12)"/>
        <circle cx="12" cy="12" r="2" fill="#61DAFB"/>
      </g>
      <!-- Next.js -->
      <g transform="translate(36, 0)">
        <circle cx="12" cy="12" r="11" fill="#000000"/>
        <text x="7" y="17" font-size="13" font-weight="900" fill="#FFFFFF">N</text>
      </g>
      <!-- Tailwind CSS -->
      <g transform="translate(72, 0)">
        <path d="M6 10 C7.5 6 10 5 12 7 C14 9 15 11 18 10 C16.5 14 14 15 12 13 C10 11 9 9 6 10 Z" fill="#06B6D4"/>
        <path d="M1 16 C2.5 12 5 11 7 13 C9 15 10 17 13 16 C11.5 20 9 21 7 19 C5 17 4 15 1 16 Z" fill="#06B6D4"/>
      </g>
      <!-- Redux -->
      <g transform="translate(108, 0)">
        <circle cx="12" cy="12" r="11" fill="#764ABC"/>
        <path d="M 8 16 Q 12 8, 16 16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Box 4: Backend (x=628, w=172) -->
  <g transform="translate(628, 4)" filter="url(#skShadow)">
    <rect x="0" y="0" width="172" height="118" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="28" class="cat-title">Backend</text>
    <g transform="translate(16, 48)">
      <!-- Node.js -->
      <g transform="translate(0, 0)">
        <polygon points="12,1 22,6.5 22,17.5 12,23 2,17.5 2,6.5" fill="#339933"/>
        <text x="5" y="16" font-size="8.5" font-weight="800" fill="#FFFFFF">node</text>
      </g>
      <!-- Express -->
      <g transform="translate(36, 0)">
        <rect x="0" y="0" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="4" y="16" font-size="11" font-weight="800" fill="#000000">ex</text>
      </g>
      <!-- FastAPI -->
      <g transform="translate(70, 0)">
        <circle cx="12" cy="12" r="11" fill="#059669"/>
        <path d="M13 3 L7 13 L11 13 L10 21 L17 11 L13 11 Z" fill="#FFFFFF"/>
      </g>
      <!-- Spring Boot -->
      <g transform="translate(104, 0)">
        <circle cx="12" cy="12" r="11" fill="#6DB33F"/>
        <path d="M12 6 C7 6 6 11 6 15 C10 15 15 14 17 9 C17 7 15 6 12 6 Z" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- Box 5: Databases & Cloud (x=816, w=184) -->
  <g transform="translate(816, 4)" filter="url(#skShadow)">
    <rect x="0" y="0" width="184" height="118" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="28" class="cat-title">Databases &amp; Cloud</text>
    <g transform="translate(16, 48)">
      <!-- PostgreSQL -->
      <g transform="translate(0, 0)">
        <ellipse cx="12" cy="12" rx="11" ry="11" fill="#336791"/>
        <path d="M 8 7 C 12 5, 17 8, 17 13 C 17 17, 13 19, 8 16" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>
      </g>
      <!-- MongoDB -->
      <g transform="translate(36, 0)">
        <path d="M12 2 C8 8 7 14 12 22 C17 14 16 8 12 2 Z" fill="#47A248"/>
        <path d="M12 6 L12 18" stroke="#FFFFFF" stroke-width="1"/>
      </g>
      <!-- Firebase -->
      <g transform="translate(68, 0)">
        <path d="M4 19 L7 4 L11 12 Z" fill="#FFA000"/>
        <path d="M19 19 L15 8 L11 12 Z" fill="#F57C00"/>
        <path d="M4 19 L11 12 L19 19 Z" fill="#FFCA28"/>
      </g>
      <!-- AWS -->
      <g transform="translate(102, 0)">
        <rect x="0" y="0" width="28" height="24" rx="4" fill="#232F3E"/>
        <text x="3" y="14" font-size="9" font-weight="900" fill="#FF9900">aws</text>
        <path d="M 4 18 Q 14 22, 24 18" stroke="#FF9900" stroke-width="1.2" fill="none"/>
      </g>
    </g>
  </g>
</svg>
