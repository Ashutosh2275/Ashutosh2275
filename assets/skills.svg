<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="skShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <style>
    .cat-title { font-size: 13px; font-weight: 700; fill: #0F172A; }
  </style>

  <!-- Box 1: Languages (x=0, w=188) -->
  <g transform="translate(0, 4)" filter="url(#skShadow)">
    <rect x="0" y="0" width="188" height="118" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="28" class="cat-title">Languages</text>
    <g transform="translate(16, 48)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <path d="M12 0 C5.4 0 5.8 2.8 5.8 2.8 L5.8 5.7 L12.2 5.7 L12.2 6.6 L3.8 6.6 C1.1 6.6 0 8.1 0 11.8 C0 15.5 2.3 15.7 3.8 15.7 L6.2 15.7 L6.2 12.3 C6.2 10.3 7.8 8.7 9.8 8.7 L16.3 8.7 C17.8 8.7 19 7.4 19 5.8 L19 2.9 C19 0.9 17.1 0 12 0 Z M9.2 1.8 C9.8 1.8 10.3 2.3 10.3 2.9 C10.3 3.5 9.8 4 9.2 4 C8.6 4 8.1 3.5 8.1 2.9 C8.1 2.3 8.6 1.8 9.2 1.8 Z" fill="#387EB8"/>
        <path d="M12 24 C18.6 24 18.2 21.2 18.2 21.2 L18.2 18.3 L11.8 18.3 L11.8 17.4 L20.2 17.4 C22.9 17.4 24 15.9 24 12.2 C24 8.5 21.7 8.3 20.2 8.3 L17.8 8.3 L17.8 11.7 C17.8 13.7 16.2 15.3 14.2 15.3 L7.7 15.3 C6.2 15.3 5 16.6 5 18.2 L5 21.1 C5 23.1 6.9 24 12 24 Z M14.8 22.2 C14.2 22.2 13.7 21.7 13.7 21.1 C13.7 20.5 14.2 20 14.8 20 C15.4 20 15.9 20.5 15.9 21.1 C15.9 21.7 15.4 22.2 14.8 22.2 Z" fill="#FFE052"/>
      </g>
      <!-- Java -->
      <g transform="translate(32, 0)">
        <rect x="0" y="0" width="24" height="24" rx="4" fill="#FFFFFF"/>
        <path d="M7 19 C10 20 14 20 17 19 M6 22 C10 23.5 14 23.5 18 22 M8 16 C11 17 13 17 16 16 M9 10 C8 7 11 5 13 3 C12 6 15 8 13 11 M13 8 C14 5 16 4 17 2 C16 5 18 6 16 9" stroke="#E76F00" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M6 14 C9 15 15 15 18 14" stroke="#5382A1" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </g>
      <!-- C -->
      <g transform="translate(64, 0)">
        <polygon points="12,1 22,6.5 22,17.5 12,23 2,17.5 2,6.5" fill="#659AD2"/>
        <path d="M15 8.5 C13.5 7.5 10 7.5 8.5 9 C7 10.5 7 13.5 8.5 15 C10 16.5 13.5 16.5 15 15.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <!-- JavaScript -->
      <g transform="translate(96, 0)">
        <rect x="0" y="0" width="24" height="24" rx="4" fill="#F7DF1E"/>
        <path d="M8 12 L8 18 C8 20 7 20.5 5 20 M14 20 C17 20 18.5 19 18.5 17 C18.5 14.5 15.5 14.5 15.5 13 C15.5 12 16.5 11.5 18 12" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- TypeScript -->
      <g transform="translate(128, 0)">
        <rect x="0" y="0" width="24" height="24" rx="4" fill="#3178C6"/>
        <path d="M4 11 L12 11 M8 11 L8 19 M13 19 C16 19 17.5 18 17.5 16.5 C17.5 14.5 14.5 14.5 14.5 13 C14.5 12 15.5 11.5 17 12" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Box 2: AI / ML (x=203, w=188) -->
  <g transform="translate(203, 4)" filter="url(#skShadow)">
    <rect x="0" y="0" width="188" height="118" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="28" class="cat-title">AI / ML</text>
    <g transform="translate(16, 48)">
      <!-- PyTorch -->
      <g transform="translate(0, 0)">
        <path d="M12 2 L13.5 4 C15 6 16.5 9 16 12 C15.5 14.5 13.5 16.5 11 16.5 C8 16.5 6 14 6.5 11 C7 8 9.5 5 12 2 Z" fill="#EE4C2C"/>
        <circle cx="16" cy="4" r="1.8" fill="#EE4C2C"/>
      </g>
      <!-- TensorFlow -->
      <g transform="translate(32, 0)">
        <path d="M2 5 L12 0 L12 24 L7 21 L7 9 L2 11.5 Z" fill="#FF6F00"/>
        <path d="M22 5 L12 0 L12 24 L17 21 L17 9 L22 11.5 Z" fill="#FFA800"/>
      </g>
      <!-- Scikit-Learn -->
      <g transform="translate(64, 0)">
        <circle cx="8" cy="12" r="7.5" fill="#3499CD"/>
        <circle cx="16" cy="12" r="7.5" fill="#F89939" opacity="0.9"/>
        <circle cx="12" cy="12" r="4.5" fill="#FFFFFF"/>
      </g>
      <!-- OpenAI -->
      <g transform="translate(96, 0)">
        <circle cx="12" cy="12" r="11" fill="#10A37F"/>
        <!-- Rosette spirals -->
        <g stroke="#FFFFFF" stroke-width="1.5" fill="none">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 3 L12 7 M12 17 L12 21 M4.5 8 L8 10 M16 14 L19.5 16 M4.5 16 L8 14 M16 10 L19.5 8"/>
        </g>
      </g>
      <!-- Hugging Face -->
      <g transform="translate(128, 0)">
        <circle cx="12" cy="12" r="11" fill="#FFD21E"/>
        <circle cx="8" cy="9.5" r="1.8" fill="#000000"/>
        <circle cx="16" cy="9.5" r="1.8" fill="#000000"/>
        <path d="M7 14 C9 18 15 18 17 14" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Box 3: Frontend (x=406, w=188) -->
  <g transform="translate(406, 4)" filter="url(#skShadow)">
    <rect x="0" y="0" width="188" height="118" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="28" class="cat-title">Frontend</text>
    <g transform="translate(16, 48)">
      <!-- React -->
      <g transform="translate(0, 0)">
        <ellipse cx="12" cy="12" rx="11" ry="4.2" fill="none" stroke="#61DAFB" stroke-width="1.5"/>
        <ellipse cx="12" cy="12" rx="11" ry="4.2" transform="rotate(60 12 12)" fill="none" stroke="#61DAFB" stroke-width="1.5"/>
        <ellipse cx="12" cy="12" rx="11" ry="4.2" transform="rotate(120 12 12)" fill="none" stroke="#61DAFB" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="2.2" fill="#61DAFB"/>
      </g>
      <!-- Next.js -->
      <g transform="translate(36, 0)">
        <circle cx="12" cy="12" r="11" fill="#000000"/>
        <path d="M7.5 18 L7.5 6 L9.5 6 L16.5 16.5 L16.5 6 L18.5 6 L18.5 18 L16.5 18 L9.5 7.5 L9.5 18 Z" fill="#FFFFFF"/>
      </g>
      <!-- Tailwind CSS -->
      <g transform="translate(72, 0)">
        <path d="M4 12 C5 9 7.5 7.5 11 8 C8 10 8.5 12 10.5 13 C12 13.5 13 14.5 13.5 16 C12 17 10 17 8 16 C6.5 15.5 5.5 14 4 12 Z" fill="#38BDF8"/>
        <path d="M11 6 C12 3 14.5 1.5 18 2 C15 4 15.5 6 17.5 7 C19 7.5 20 8.5 20.5 10 C19 11 17 11 15 10 C13.5 9.5 12.5 8 11 6 Z" fill="#38BDF8"/>
      </g>
      <!-- HTML5 / CSS3 -->
      <g transform="translate(108, 0)">
        <path d="M3 2 L5 21 L12 23 L19 21 L21 2 Z" fill="#E34F26"/>
        <path d="M12 3.5 L12 21.2 L17.5 19.6 L19.2 3.5 Z" fill="#EF652A"/>
        <path d="M7 6.5 L17 6.5 L16.5 10 L12 10 L12 12.5 L16.2 12.5 L15.6 17.2 L12 18.2 L12 15.8 L14 15.3 L14.2 13.5 L7.5 13.5 Z" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- Box 4: Backend (x=609, w=188) -->
  <g transform="translate(609, 4)" filter="url(#skShadow)">
    <rect x="0" y="0" width="188" height="118" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="28" class="cat-title">Backend</text>
    <g transform="translate(16, 48)">
      <!-- FastAPI -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="11" fill="#009688"/>
        <path d="M13 3 L5 13 L11 13 L10 21 L19 10 L13 10 Z" fill="#FFFFFF"/>
      </g>
      <!-- Spring Boot -->
      <g transform="translate(36, 0)">
        <circle cx="12" cy="12" r="11" fill="#6DB33F"/>
        <path d="M7 16 C7 9 12 7 17 7 C17 14 13 17 7 16 Z" fill="#FFFFFF"/>
        <line x1="7" y1="16" x2="15" y2="9" stroke="#6DB33F" stroke-width="1.5"/>
      </g>
      <!-- Node.js -->
      <g transform="translate(72, 0)">
        <polygon points="12,1 22,6.5 22,17.5 12,23 2,17.5 2,6.5" fill="#539E43"/>
        <text x="6" y="17" fill="#FFFFFF" font-size="12" font-weight="800">N</text>
      </g>
      <!-- Express -->
      <g transform="translate(108, 0)">
        <circle cx="12" cy="12" r="11" fill="#1E293B"/>
        <text x="4.5" y="16.5" fill="#FFFFFF" font-size="10" font-weight="700">ex</text>
      </g>
    </g>
  </g>

  <!-- Box 5: Databases (x=812, w=188) -->
  <g transform="translate(812, 4)" filter="url(#skShadow)">
    <rect x="0" y="0" width="188" height="118" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="28" class="cat-title">Databases</text>
    <g transform="translate(16, 48)">
      <!-- PostgreSQL -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="11" fill="#336791"/>
        <path d="M8 8 C8 6 12 6 14 7 C16 8 17 11 17 14 C17 17 15 18 13 18 C11 18 10 16 10 14" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="11" cy="10" r="1" fill="#FFFFFF"/>
      </g>
      <!-- MongoDB -->
      <g transform="translate(36, 0)">
        <path d="M12 1 C10 6 7 11 7 15 C7 19 9.5 22 12 23 C14.5 22 17 19 17 15 C17 11 14 6 12 1 Z" fill="#47A248"/>
        <path d="M12 1 L12 23" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
      </g>
      <!-- Firebase -->
      <g transform="translate(72, 0)">
        <path d="M4 17 L8 4 L11 9 L4 17 Z" fill="#FFA000"/>
        <path d="M4 17 L12 22 L20 17 L14 2 Z" fill="#F57C00"/>
        <path d="M14 2 L20 17 L12 10 Z" fill="#FFCA28"/>
      </g>
      <!-- Redis -->
      <g transform="translate(108, 0)">
        <polygon points="12,2 22,7 12,12 2,7" fill="#D82C20"/>
        <polygon points="2,7 12,12 12,22 2,17" fill="#A32219"/>
        <polygon points="22,7 12,12 12,22 22,17" fill="#D82C20"/>
      </g>
    </g>
  </g>
</svg>
