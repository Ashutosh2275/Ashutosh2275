<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 96" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="valShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <style>
    .val-title { font-size: 14px; font-weight: 700; fill: #0F172A; }
    .val-sub { font-size: 11.5px; font-weight: 500; fill: #64748B; }
  </style>

  <!-- Card 1: Learn (x=0) -->
  <g transform="translate(0, 4)" filter="url(#valShadow)">
    <rect x="0" y="0" width="228" height="88" rx="14" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="16" y="14" width="32" height="32" rx="8" fill="#F5F3FF"/>
    <!-- Brain / Intellect Icon -->
    <path d="M26 23 C25 20 27 18 29 18 C31 18 32 19 33 21 C34 19 36 18 37 19 C39 20 39 22 38 24 C40 25 40 27 39 29 C38 30 36 31 35 30 C34 32 32 32 31 31 C30 32 28 31 27 30 C26 29 25 27 26 25 C25 24 25 23 26 23 Z" fill="#7C3AED"/>
    <text x="16" y="62" class="val-title">Learn</text>
    <text x="16" y="78" class="val-sub">New Technologies</text>
  </g>

  <!-- Card 2: Build (x=244) -->
  <g transform="translate(244, 4)" filter="url(#valShadow)">
    <rect x="0" y="0" width="228" height="88" rx="14" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="16" y="14" width="32" height="32" rx="8" fill="#F0FDF4"/>
    <!-- Code Brackets </ > Icon -->
    <path d="M25 26 L20 30 L25 34 M39 26 L44 30 L39 34 M34 22 L30 38" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="16" y="62" class="val-title">Build</text>
    <text x="16" y="78" class="val-sub">Real Applications</text>
  </g>

  <!-- Card 3: Collaborate (x=488) -->
  <g transform="translate(488, 4)" filter="url(#valShadow)">
    <rect x="0" y="0" width="228" height="88" rx="14" fill="#FFFFFF" stroke="#FEF3C7" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="16" y="14" width="32" height="32" rx="8" fill="#FFFBEB"/>
    <!-- Users / People Icon -->
    <circle cx="28" cy="24" r="4" fill="#D97706"/>
    <circle cx="36" cy="25" r="3.2" fill="#F59E0B"/>
    <path d="M21 34 C21 30.5 24.5 29 28 29 C31.5 29 35 30.5 35 34" fill="#D97706"/>
    <path d="M33 34 C33 31.8 35.5 30.5 38 30.5 C40.5 30.5 43 31.8 43 34" fill="#F59E0B"/>
    <text x="16" y="62" class="val-title">Collaborate</text>
    <text x="16" y="78" class="val-sub">With Amazing People</text>
  </g>

  <!-- Card 4: Create (x=732) -->
  <g transform="translate(732, 4)" filter="url(#valShadow)">
    <rect x="0" y="0" width="228" height="88" rx="14" fill="#FFFFFF" stroke="#FEE2E2" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="16" y="14" width="32" height="32" rx="8" fill="#FEF2F2"/>
    <!-- Rocket Icon -->
    <path d="M38 20 C34 20 27 24 25 30 C24 33 24 35 25 37 L23 39 C22 40 22 41 23 42 C24 43 25 43 26 42 L28 40 C30 41 32 41 35 40 C41 38 45 31 45 27 C45 23 42 20 38 20 Z" fill="#E11D48"/>
    <circle cx="36" cy="27" r="2.2" fill="#FFFFFF"/>
    <path d="M25 37 L21 37 C20 37 19.5 36 20 35 L22 33" stroke="#E11D48" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M28 40 L28 44 C28 45 29 45.5 30 45 L32 43" stroke="#E11D48" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="16" y="62" class="val-title">Create</text>
    <text x="16" y="78" class="val-sub">Real-World Impact</text>
  </g>
</svg>
