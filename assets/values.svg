<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 96" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="valShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <style>
    .val-title { font-size: 14.5px; font-weight: 700; fill: #0F172A; }
    .val-sub { font-size: 11.5px; font-weight: 500; fill: #64748B; }
  </style>

  <!-- Card 1: Learn (x=0) -->
  <g transform="translate(0, 4)" filter="url(#valShadow)">
    <rect x="0" y="0" width="228" height="88" rx="14" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="18" y="14" width="34" height="34" rx="9" fill="#F5F3FF"/>
    <!-- Brain / Intellect Icon -->
    <path d="M29 23 C28 20 30 18 32 18 C34 18 35 19 36 21 C37 19 39 18 40 19 C42 20 42 22 41 24 C43 25 43 27 42 29 C41 30 39 31 38 30 C37 32 35 32 34 31 C33 32 31 31 30 30 C29 29 28 27 29 25 C28 24 28 23 29 23 Z" fill="#7C3AED"/>
    <text x="18" y="63" class="val-title">Learn</text>
    <text x="18" y="79" class="val-sub">New Technologies</text>
  </g>

  <!-- Card 2: Build (x=244) -->
  <g transform="translate(244, 4)" filter="url(#valShadow)">
    <rect x="0" y="0" width="228" height="88" rx="14" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="18" y="14" width="34" height="34" rx="9" fill="#F0FDF4"/>
    <!-- Code Brackets </ > Icon -->
    <path d="M28 26 L23 31 L28 36 M42 26 L47 31 L42 36 M37 22 L33 40" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="18" y="63" class="val-title">Build</text>
    <text x="18" y="79" class="val-sub">Real Applications</text>
  </g>

  <!-- Card 3: Collaborate (x=488) -->
  <g transform="translate(488, 4)" filter="url(#valShadow)">
    <rect x="0" y="0" width="228" height="88" rx="14" fill="#FFFFFF" stroke="#FEF3C7" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="18" y="14" width="34" height="34" rx="9" fill="#FFFBEB"/>
    <!-- Users / People Icon -->
    <circle cx="31" cy="25" r="4.2" fill="#D97706"/>
    <circle cx="39" cy="26" r="3.4" fill="#F59E0B"/>
    <path d="M23 36 C23 32 27 30.5 31 30.5 C35 30.5 39 32 39 36" fill="#D97706"/>
    <path d="M36 36 C36 33.5 39 32 42 32 C44.5 32 47 33.5 47 36" fill="#F59E0B"/>
    <text x="18" y="63" class="val-title">Collaborate</text>
    <text x="18" y="79" class="val-sub">With Amazing People</text>
  </g>

  <!-- Card 4: Create (x=732) -->
  <g transform="translate(732, 4)" filter="url(#valShadow)">
    <rect x="0" y="0" width="228" height="88" rx="14" fill="#FFFFFF" stroke="#FEE2E2" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="18" y="14" width="34" height="34" rx="9" fill="#FEF2F2"/>
    <!-- Rocket Icon -->
    <path d="M41 21 C37 21 30 25 28 31 C27 34 27 36 28 38 L26 40 C25 41 25 42 26 43 C27 44 28 44 29 43 L31 41 C33 42 35 42 38 41 C44 39 48 32 48 28 C48 24 45 21 41 21 Z" fill="#E11D48"/>
    <circle cx="39" cy="28" r="2.3" fill="#FFFFFF"/>
    <path d="M28 38 L24 38 C23 38 22.5 37 23 36 L25 34" stroke="#E11D48" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M31 41 L31 45 C31 46 32 46.5 33 46 L35 44" stroke="#E11D48" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="18" y="63" class="val-title">Create</text>
    <text x="18" y="79" class="val-sub">Real-World Impact</text>
  </g>
</svg>
