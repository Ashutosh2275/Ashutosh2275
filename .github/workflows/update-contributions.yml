name: Update GitHub Activity & Daily Contributions

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

concurrency:
  group: contribution-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Configure Git Author
        run: |
          git config user.name "Ashutosh Mishra"
          git config user.email "ashutoshmishra2275@gmail.com"

      - name: Run daily contribution deployment and activity sync
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/daily_auto_contribute.py

      - name: Validate outputs
        run: |
          python -c "
          import json, xml.etree.ElementTree as ET
          ET.parse('assets/github-activity.svg')
          d = json.load(open('assets/contributions.json'))
          s = d['stats']
          assert d['days'], 'no contribution days'
          assert s['lifetime'] == sum(y['total'] for y in s['yearly']), 'lifetime != sum of years'
          print('OK lifetime', s['lifetime'], 'today', s.get('today', 0), 'mode', s['mode'])
          "

      - name: Push updates to repository
        run: |
          git pull --rebase origin main || true
          git push origin main
