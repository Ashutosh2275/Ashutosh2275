name: Update GitHub Activity

"on":
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_contributions.py"
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

concurrency:
  group: contribution-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install beautifulsoup4
      - name: Generate activity SVG and dataset
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_contributions.py
      - name: Validate outputs
        run: |
          python -c "
          import json, xml.etree.ElementTree as ET
          ET.parse('assets/github-activity.svg')
          d = json.load(open('assets/contributions.json'))
          s = d['stats']
          assert d['days'], 'no contribution days'
          assert s['lifetime'] == sum(y['total'] for y in s['yearly']), 'lifetime != sum of years'
          print('OK lifetime', s['lifetime'], 'mode', s['mode'])
          "
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add assets/github-activity.svg assets/contributions.json
          git diff --staged --quiet || (git commit -m "chore: refresh contribution activity [skip ci]" && git push)
